name: Build macOS Release

# Builds the macOS release + auto-update artifacts on GitHub's runners (the
# "build from another PC" path for macOS) by invoking the same script used
# locally — ./scripts/build_macos.sh. Runs on an Apple Silicon runner
# (macos-14), matching the local arm64 engine builds. Publishing stays
# manual: download the artifacts and run ./scripts/publish_release.sh.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build release (engine + app + auto-update artifacts)
        run: ./scripts/build_macos.sh

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compresstor-macos-update
          path: |
            release/Compresstor-*.zip
            release/Compresstor-*.sha256
          retention-days: 90
