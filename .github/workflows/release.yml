name: Release

# Push a v* tag → builds macOS + Windows → creates a GitHub Release with
# both platform zips + checksums attached. One tag push = done.

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS release
        run: ./scripts/build_macos.sh --dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/MacOS/Compresstor-*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Windows release
        shell: cmd
        run: scripts\build_windows.bat

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/Compresstor-*-windows-setup.exe

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Compresstor-*.dmg
            artifacts/Compresstor-*-windows-setup.exe
