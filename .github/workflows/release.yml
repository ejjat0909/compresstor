name: Release

# Push a v* tag → builds macOS + Windows → creates a GitHub Release with
# installers (DMG + setup.exe) for users and update zips + checksums for
# the in-app auto-updater. One tag push = done.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS release
        run: ./scripts/build_macos.sh --dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/MacOS/Compresstor-*.dmg
            release/Compresstor-*-macos.zip
            release/Compresstor-*.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode signing certificate
        if: env.SIGN_CERT != ''
        shell: cmd
        env:
          SIGN_CERT: ${{ secrets.WIN_SIGN_CERT }}
        run: |
          echo %SIGN_CERT% > cert_b64.txt
          certutil -decode cert_b64.txt cert.pfx
          del cert_b64.txt

      - name: Build Windows release
        shell: cmd
        env:
          SIGN_PFX: ${{ secrets.WIN_SIGN_CERT != '' && 'cert.pfx' || '' }}
          SIGN_PWD: ${{ secrets.WIN_SIGN_PWD }}
        run: scripts\build_windows.bat

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/Compresstor-*-windows-setup.exe
            release/Compresstor-*-windows.zip
            release/Compresstor-*.sha256

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: cat artifacts/Compresstor-*.sha256 | sort -u > artifacts/checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Compresstor-*.dmg
            artifacts/Compresstor-*-windows-setup.exe
            artifacts/Compresstor-*-macos.zip
            artifacts/Compresstor-*-windows.zip
            artifacts/checksums.sha256
