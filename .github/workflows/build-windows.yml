name: Build Windows Release

# Builds the Windows release + auto-update artifacts on GitHub's runners
# (the "build from another PC" path for Windows) by invoking the same
# script used locally — scripts\build_windows.bat. Publishing stays manual:
# download the artifacts and run ./scripts/publish_release.sh (or create the
# GitHub release from the Actions page).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build release (engine + app + auto-update artifacts)
        shell: cmd
        run: scripts\build_windows.bat

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compresstor-windows-update
          path: |
            release/Compresstor-*.zip
            release/Compresstor-*.sha256
          retention-days: 90
